<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyCamp — интерактивный курс Python</title>
<meta name="description" content="PyCamp — бесплатный интерактивный курс Python в браузере: теория, задачи, автопроверка кода.">
<style>
:root{
  --bg:#0d1117; --bg2:#131a24; --panel:#161d27; --panel2:#1c2531;
  --line:#26313f; --txt:#e6edf3; --muted:#8b98a9;
  --acc:#3fb950; --acc2:#2ea043; --blue:#58a6ff; --warn:#d29922; --bad:#f85149;
  --mono:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 15% -10%,#16233a 0%,transparent 60%),var(--bg);
  color:var(--txt);font-family:var(--ui);font-size:15px;line-height:1.6;
  min-height:100vh;-webkit-font-smoothing:antialiased;
}
a{color:var(--blue)}
code,pre,kbd{font-family:var(--mono)}
code{background:#0b1220;border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:.9em;color:#a5d6ff}
pre{background:#0b1220;border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto}
pre code{background:none;border:none;padding:0;color:#c9d1d9}

/* ---------- header ---------- */
header.top{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
  padding:10px 16px;background:rgba(13,17,23,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;white-space:nowrap}
.brand .logo{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,#2ea043,#1f6feb);font-size:17px
}
.brand small{color:var(--muted);font-weight:500;font-size:12px}
.grow{flex:1}
.gprog{display:flex;align-items:center;gap:10px;min-width:180px;max-width:340px;flex:1}
.bar{height:9px;background:#0b1220;border:1px solid var(--line);border-radius:99px;overflow:hidden;flex:1}
.bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2ea043,#58a6ff);transition:width .35s}
.gprog span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:99px;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);white-space:nowrap
}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.pill.ok .dot{background:var(--acc)} .pill.bad .dot{background:var(--bad)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:320px 1fr;gap:0;align-items:start}
nav.side{
  position:sticky;top:53px;height:calc(100vh - 53px);overflow-y:auto;
  border-right:1px solid var(--line);background:rgba(19,26,36,.6);padding:14px 10px 60px
}
nav.side h3{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:16px 8px 8px}
.mod{border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden;background:var(--panel)}
.mod > button{
  width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--txt);
  padding:10px 12px;cursor:pointer;font:inherit;text-align:left
}
.mod > button:hover{background:var(--panel2)}
.mod .ic{font-size:17px}
.mod .mt{font-weight:600;font-size:14px;flex:1}
.mod .mc{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.mod ul{list-style:none;margin:0;padding:0 0 6px}
.mod li a{
  display:flex;gap:9px;align-items:flex-start;padding:7px 12px 7px 14px;color:var(--muted);
  text-decoration:none;font-size:13.5px;border-left:2px solid transparent
}
.mod li a:hover{background:var(--panel2);color:var(--txt)}
.mod li a.active{background:#16243a;color:#fff;border-left-color:var(--blue)}
.mod li a .st{width:16px;flex:0 0 16px;text-align:center;font-size:12px;color:#39424f}
.mod li a.done .st{color:var(--acc)}
.mod.done .mc{color:var(--acc)}
.hide{display:none !important}

main{padding:24px 28px 120px;max-width:1040px}
.crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;margin-bottom:6px}
h1.lt{font-size:26px;margin:0 0 4px;line-height:1.25}
.meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.card > h2{
  font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  margin:0 0 10px;display:flex;align-items:center;gap:8px
}
.card p{margin:0 0 10px} .card p:last-child{margin-bottom:0}
.card ul,.card ol{margin:0 0 10px;padding-left:22px}
.task{border-color:#2b4a6b;background:linear-gradient(180deg,#14243a,rgba(22,29,39,.55))}

/* ---------- editor ---------- */
.ed{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0b1220}
.edbar{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--panel2);border-bottom:1px solid var(--line)}
.edbar .fname{font-family:var(--mono);font-size:12px;color:var(--muted)}
.dots{display:flex;gap:5px;margin-right:4px}
.dots i{width:10px;height:10px;border-radius:50%;background:#39424f;display:block}
.dots i:nth-child(1){background:#f85149}.dots i:nth-child(2){background:#d29922}.dots i:nth-child(3){background:#3fb950}
.edwrap{display:flex;position:relative;max-height:460px;overflow:auto}
.gutter{
  padding:12px 8px 12px 12px;text-align:right;color:#3d4657;background:#0a1018;user-select:none;
  font-family:var(--mono);font-size:13px;line-height:1.55;border-right:1px solid var(--line);min-width:42px
}
textarea.code{
  flex:1;border:0;outline:0;resize:vertical;background:#0b1220;color:#c9d1d9;
  font-family:var(--mono);font-size:13px;line-height:1.55;padding:12px;min-height:220px;
  tab-size:4;white-space:pre;overflow-wrap:normal;overflow-x:auto
}
textarea.code:focus{background:#0c1424}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
button.btn{
  font:inherit;font-size:14px;font-weight:600;border-radius:9px;border:1px solid var(--line);
  background:var(--panel2);color:var(--txt);padding:9px 15px;cursor:pointer;display:inline-flex;
  align-items:center;gap:7px
}
button.btn:hover{border-color:#3a4a5e;background:#212c3a}
button.btn.primary{background:var(--acc2);border-color:var(--acc2);color:#06230d}
button.btn.primary:hover{background:#39b24a}
button.btn[disabled]{opacity:.5;cursor:not-allowed}
button.btn.ghost{background:none}
kbd{background:#0b1220;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;font-size:11px;color:var(--muted)}

/* ---------- output ---------- */
.out{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0b1220}
.outhead{padding:8px 12px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;gap:10px;align-items:center}
.outbody{padding:12px;font-family:var(--mono);font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto}
.check{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-family:var(--ui);font-size:13.5px}
.check .mk{flex:0 0 18px}
.check.ok{color:var(--acc)} .check.no{color:var(--bad)}
.check .msg{color:var(--txt)}
.check .dbg{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:3px;white-space:pre-wrap}
.stdout{color:#8b98a9;border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
.stdout b{color:#c9d1d9;font-weight:600}
.expected{color:var(--warn);font-size:12.5px;margin-top:6px;font-family:var(--mono);white-space:pre-wrap}
.banner{border-radius:10px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;font-weight:600}
.banner.ok{background:#0f2a17;border:1px solid #2ea043;color:#7ee787}
.banner.no{background:#2b1416;border:1px solid #f85149;color:#ff9a92}
.banner.info{background:#122236;border:1px solid #1f6feb;color:#a5d6ff}
.hints li{margin-bottom:7px}
.hidden{display:none}
.solution{border-color:#3d3320;background:linear-gradient(180deg,#241d0e,rgba(22,29,39,.55))}
.footer{display:flex;gap:10px;align-items:center;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.spin{
  width:14px;height:14px;border-radius:50%;border:2px solid #445;border-top-color:var(--acc);
  animation:sp .8s linear infinite;display:inline-block
}
@keyframes sp{to{transform:rotate(360deg)}}
.center{text-align:center;color:var(--muted);padding:40px 10px}
.done-wrap{max-width:720px}
.cert{border:1px solid var(--acc);border-radius:14px;padding:22px;background:linear-gradient(180deg,#0f2a17,#131a24)}
.cert h2{font-size:20px;margin:0 0 6px;color:#7ee787;letter-spacing:0;text-transform:none}
.cert input{
  background:#0b1220;border:1px solid var(--line);border-radius:8px;color:var(--txt);
  font:inherit;padding:8px 10px;width:100%;max-width:320px
}
.mob{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  nav.side{position:fixed;inset:53px 0 0 0;z-index:35;transform:translateX(-102%);transition:transform .25s;height:auto}
  nav.side.open{transform:none}
  main{padding:16px 14px 100px}
  .mob{display:inline-flex}
  .gprog{display:none}
  .brand small{display:none}
}
</style>
</head>
<body>
<header class="top">
  <button class="btn mob ghost" id="burger" title="Оглавление">☰</button>
  <div class="brand"><span class="logo">🐍</span><span>PyCamp<br><small>курс Python в браузере</small></span></div>
  <div class="grow"></div>
  <div class="gprog" title="Прогресс курса">
    <div class="bar"><i id="gbar"></i></div><span id="gtxt">0%</span>
  </div>
  <span class="pill" id="pyst"><span class="dot"></span><span id="pytxt">Python загружается…</span></span>
</header>

<div class="app">
  <nav class="side" id="side">
    <h3>Программа курса</h3>
    <div id="toc"></div>
    <div style="padding:10px 8px">
      <button class="btn ghost" id="resetAll" style="font-size:12.5px;padding:7px 10px">↺ Сбросить весь прогресс</button>
    </div>
  </nav>
  <main id="main"></main>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
/* =======================================================================
   PyCamp — одностраничный интерактивный курс Python.
   Данные курса ниже собираются в массив MODULES.
   ======================================================================= */
const MODULES = [];
/* ==== a_basics.js ==== */
MODULES.push({
  id: "basics",
  title: "Старт",
  icon: "🚀",
  blurb: "Первые шаги в Python: печатаем текст, пишем комментарии, заводим переменные и разбираемся с типами данных.",
  lessons: [
    {
      id: "hello-world",
      title: "Первая программа: print",
      minutes: 8,
      theory: `<p><code>print()</code> — самая первая функция, которую узнаёт каждый программист на Python. Она выводит значение на экран (в консоль) и после вывода добавляет перевод строки.</p>
<p>Текст в Python заключается в кавычки — двойные или одинарные. Такой текст называется строкой (string).</p>
<pre><code>print("Привет, мир!")
print('Python — это просто')</code></pre>
<p>Можно напечатать и результат вычисления: Python сначала посчитает, а потом покажет ответ.</p>
<pre><code>print(2 + 3)</code></pre>
<p>В этом уроке тебе нужно не только напечатать приветствие, но и сохранить текст в переменную (variable) — именованную «коробку» со значением. Пишем так: имя, знак равенства, значение.</p>
<pre><code>message = "Привет, мир!"
print(message)</code></pre>
<p>Функция <code>print()</code> получила значение переменной <code>message</code> и показала его на экране. Такой код легко читать и менять: поправил текст один раз — и он обновится везде, где используется переменная.</p>
<p>Обрати внимание: имя переменной пишется без кавычек, а её значение — в кавычках. Если кавычки поставить вокруг имени, Python напечатает само слово, а не сохранённый в нём текст.</p>
<p>Запусти программу несколько раз и меняй текст — так быстрее всего привыкнешь к мысли, что код выполняется строго сверху вниз, строка за строкой. Ошибка в одной строке останавливает всю программу, поэтому читай сообщения Python внимательно: он подсказывает и строку, и причину.</p>`,
      task: `<p>Напиши свою первую программу.</p>
<ul>
<li>Создай переменную <code>message</code> со строкой <strong>Привет, мир!</strong>.</li>
<li>Выведи её на экран через <code>print()</code>.</li>
</ul>
<p>Программа должна напечатать ровно одну строку: <code>Привет, мир!</code></p>`,
      starter: `# Создай переменную message и напечатай её
message = "..."
print(message)`,
      solution: `message = "Привет, мир!"
print(message)`,
      tests: `assert message == "Привет, мир!", "В переменной message должна быть строка «Привет, мир!»"`,
      expected: "Привет, мир!",
      hints: ['Текст пишем в кавычках: message = "Привет, мир!"', 'Печатаем переменную так: print(message) — без кавычек вокруг имени.', "Сравни своё сообщение с образцом посимвольно: важны и запятая, и восклицательный знак."],
      solutionNote: "Мы сохраняем текст в переменную, а потом печатаем её: так видно, что print() выводит значения переменных, а не только литералы. Точка с запятой в конце строки не нужна — её роль выполняет перевод строки."
    },
    {
      id: "print-more",
      title: "print с текстом и числами, sep/end",
      minutes: 10,
      theory: `<p><code>print()</code> умеет выводить сразу несколько значений. Перечисли их через запятую — функция сама поставит между ними пробел.</p>
<pre><code>print("Сумма:", 12)
print("Возраст", 7, "лет")</code></pre>
<p>Как видишь, строки пишут в кавычках, а числа — без. Python печатает число как есть, а строку показывает без кавычек.</p>
<p>Два необязательных параметра меняют поведение функции:</p>
<ul>
<li><code>sep</code> (separator — разделитель) задаёт строку между значениями. По умолчанию это пробел.</li>
<li><code>end</code> задаёт то, что печатается в самом конце. По умолчанию это перевод строки.</li>
</ul>
<pre><code>print("2024", "09", "27", sep="-")
print("Считаем", end=" ... ")
print("готово")</code></pre>
<p>Первый вызов напечатает <code>2024-09-27</code>. Во втором случае <code>end</code> заменил перевод строки на « ... », поэтому третья строка оказалась на той же строке.</p>
<p>Параметры указывают по имени, после всех значений: <code>print(значения, sep=..., end=...)</code>. Значения вычисляются до печати, поэтому в <code>print()</code> можно смело передавать переменные и выражения вроде <code>a + b</code>.</p>
<p>У <code>print()</code> есть и другие возможности, но <code>sep</code> и <code>end</code> нужны чаще всего. Поэкспериментируй: поставь <code>sep=""</code> и посмотри, как значения склеятся без пробелов, или задай <code>end="\n\n"</code>, чтобы между строками появился пустой промежуток. Такие мелочи сильно влияют на вид вывода.</p>`,
      task: `<p>Даны <code>a = 7</code> и <code>b = 5</code>.</p>
<ol>
<li>Вычисли сумму и сохрани её в переменную <code>total</code>.</li>
<li>Первой строкой напечатай <code>7 + 5 = 12</code>: одним <code>print()</code> с <code>sep</code> и <code>end</code>, а число добавь вторым <code>print(total)</code>.</li>
<li>Второй строкой напечатай <code>Сумма: 12</code> — строку и значение через запятую.</li>
</ol>`,
      starter: `a = 7
b = 5
# вычисли total и напечатай две строки: "7 + 5 = 12" и "Сумма: 12"
total = 0
print(a, b, total)
print("Сумма:", total)`,
      solution: `a = 7
b = 5
total = a + b
print(a, b, sep=" + ", end=" = ")
print(total)
print("Сумма:", total)`,
      tests: `assert total == 12, "total должен быть равен 12"
assert total == a + b, "total вычисляй как сумму a и b"`,
      expected: "7 + 5 = 12\nСумма: 12",
      hints: ["Сначала посчитай сумму: total = a + b", 'Разделитель и конец задаются так: print(a, b, sep=" + ", end=" = ")', "После строки с end=... следующий print() продолжит ту же строку, а не начнёт новую."],
      solutionNote: "print(a, b, sep=\" + \", end=\" = \") печатает «7 + 5 = » и не переводит строку, поэтому следующий print(total) дописывает 12 в ту же строку."
    },
    {
      id: "comments",
      title: "Комментарии и читаемый код",
      minutes: 8,
      theory: `<p>Комментарий (comment) — это заметка в коде, которую Python полностью игнорирует. Он начинается с символа <code>#</code> и продолжается до конца строки.</p>
<pre><code># Считаем площадь квадрата
side = 6
area = side * side
print(area)</code></pre>
<p>Зачем они нужны?</p>
<ul>
<li>объяснить, зачем написан этот кусок кода;</li>
<li>оставить пометку на будущее: что переделать, что проверить;</li>
<li>временно «выключить» строку кода, поставив перед ней <code>#</code>.</li>
</ul>
<p>Комментарий может стоять и в конце строки с кодом:</p>
<pre><code>price = 150  # цена в рублях</code></pre>
<p>Хороший комментарий объясняет смысл, а не пересказывает очевидное. Сравни: <code># увеличиваем x на 1</code> почти бесполезно, потому что это и так видно; <code># начисляем бонус за каждый год стажа</code> — уже полезно.</p>
<p>Правило простое: код говорит «как», а комментарий — «почему». Пиши комментарии коротко и по-русски, чтобы через месяц ты сам понял свою запись.</p>
<p>Ещё один плюс: закомментированные строки не выполняются, поэтому так удобно проверять разные варианты решения.</p>
<p>Не бойся писать комментарии: они ничего не замедляют и не занимают память, потому что Python выбрасывает их ещё до запуска. Главное — держать их актуальными. Устаревший комментарий хуже отсутствующего: он путает и тебя, и любого, кто откроет твой код.</p>`,
      task: `<p>Дан код для площади квадрата. Доработай его:</p>
<ul>
<li>добавь комментарий, который объясняет, что такое <code>side</code>;</li>
<li>посчитай площадь: <code>area = side * side</code>, где <code>side = 6</code>;</li>
<li>напечатай значение <code>area</code>.</li>
</ul>`,
      starter: `side = 6
# добавь комментарий и вычисли площадь квадрата
area = 0
print(area)`,
      solution: `# Сторона квадрата в сантиметрах
side = 6
# Площадь квадрата — сторона, умноженная на себя
area = side * side
print(area)`,
      tests: `assert side == 6, "side должен быть равен 6"

      title: "Класс и объект",
      minutes: 12,
      theory: `<p>Класс (class) — это чертёж, по которому создаются объекты (objects). Объект ещё называют экземпляром класса. Один класс — сколько угодно объектов.</p>
<p>Класс объявляется словом <code>class</code>, имя пишут с большой буквы:</p>
<pre><code>class Dog:
    species = "собака"</code></pre>
<p>Здесь <code>species</code> — атрибут класса (class attribute). Он общий для всех объектов этого класса, и к нему можно обращаться как через класс, так и через объект.</p>
<pre><code>print(Dog.species)   # собака

rex = Dog()
print(rex.species)   # собака</code></pre>
<p>Создание объекта выглядит как вызов класса со скобками: <code>rex = Dog()</code>. После этого объекту можно добавлять собственные атрибуты (attributes) — данные, которые принадлежат именно ему:</p>

      title: "try / except: ловим ошибки",
      minutes: 12,
      theory: `<p><strong>Исключение (exception)</strong> — это сигнал, что программа не может продолжить работу: деление на ноль, неверный ввод, отсутствие файла. Если исключение не обработать, программа падает и печатает длинный traceback.</p>
<p>Конструкция <code>try / except</code> позволяет поймать ошибку и спокойно на неё отреагировать.</p>
<pre><code>try:
    x = int("42")
except ValueError:
    x = -1
</code></pre>
<p>Читается так: «попробуй выполнить код в <code>try</code>; если возникнет <code>ValueError</code>, выполни код в <code>except</code>».</p>
<ul>
<li><code>try</code> — блок с рискованным кодом;</li>
<li><code>except</code> — что делать, если ошибка случилась;</li>
<li>класс ошибки указывают явно: <code>ValueError</code>, <code>ZeroDivisionError</code>, <code>FileNotFoundError</code>;</li>
<li><code>else</code> сработает, если ошибки не было, а <code>finally</code> — всегда.</li>
</ul>
<p>Ловить все ошибки сразу через «голый» <code>except:</code> не стоит: так можно проглотить настоящую проблему и потом долго её искать. Указывай конкретный класс. Если по смыслу ошибка нормальна, а не катастрофа, функцию удобно вернуть особое значение — например, <code>None</code> или <code>-1</code>.</p>
<p>Смотри, как это выглядит в деле:</p>
<pre><code>def to_int(text):
    try:
        return int(text)
    except ValueError:
        return -1
</code></pre>
<p>Такой приём называют «безопасной» функцией: она никогда не падает, а сообщает о проблеме возвращаемым значением.</p>`,

<li><code>O(n²)</code> — квадратичное: вложенные циклы, проход по всем парам элементов;</li>

<p>У каждой рекурсивной функции есть две части:</p>
<ul>
<li><strong>базовый случай</strong> — когда ответ известен сразу и вызов себя прекращается;</li>

<p>Без базового случая функция будет вызывать себя бесконечно и упадёт с <code>RecursionError</code>.</p>

    return n * factorial(n - 1)

<p>Считая <code>factorial(3)</code>, Python раскручивает цепочку: 3 · factorial(2) → 3 · 2 · factorial(1) → 3 · 2 · 1 · factorial(0) → 6. Каждый вызов ждёт результат следующего.</p>

/* плоский список уроков + ссылки на модуль */

  COURSE.push(l);
}));
const LESSONS = COURSE;

/* ---------- прогресс ---------- */
const KEY = 'pycamp.v1';
let state = load();
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.lessons) return s; } catch (e) {}
  return { lessons: {} };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
const rec = id => (state.lessons[id] = state.lessons[id] || {});

/* ---------- статус Python ---------- */
const pyst = $('#pyst'), pytxt = $('#pytxt');
function setPy(cls, text) { pyst.className = 'pill ' + cls; pytxt.textContent = text; }

/* ---------- Pyodide ---------- */
let pyodide = null, pyLoading = null;
const PY_CDN = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
function loadPython() {
  if (pyLoading) return pyLoading;
  pyLoading = (async () => {
    if (typeof loadPyodide !== 'function') throw new Error('pyodide.js не загрузился (нет сети?)');
    pyodide = await loadPyodide({ indexURL: PY_CDN });
    await pyodide.runPythonAsync(RUNNER_SRC);
    setPy('ok', 'Python готов');
    return pyodide;
  })().catch(e => { setPy('bad', 'Python не загрузился'); pyLoading = null; throw e; });
  return pyLoading;

/* Python-обёртка: выполняет код ученика, затем проверки, возвращает JSON. */
const RUNNER_SRC = `
import sys, io, json, traceback, base64, ast

def _pycamp_decode(buf):
    return base64.b64decode(buf).decode('utf-8')

def _pycamp_split(tests):
    """Разбивает проверки на верхнеуровневые блоки (try/for/if целиком), import клеит к следующему."""
    tree = ast.parse(tests)
    lines = tests.splitlines()
    segs = []
    start = 0
    nodes = tree.body
    for i, node in enumerate(nodes):
        if isinstance(node, (ast.Import, ast.ImportFrom)) and i + 1 < len(nodes):
            continue
        end = node.end_lineno
        seg = '\\n'.join(lines[start:end])
        if seg.strip():
            segs.append(seg.strip('\\n'))
        start = end
    if start < len(lines):
        rest = '\\n'.join(lines[start:])
        if rest.strip():
            segs.append(rest.strip('\\n'))
    return segs

def _pycamp_run(user_b64, tests_b64, stdin_b64, expected_b64, limit):
    user = _pycamp_decode(user_b64)
    tests = _pycamp_decode(tests_b64)
    stdin_data = _pycamp_decode(stdin_b64)
    expected = None
    if expected_b64:
        expected = _pycamp_decode(expected_b64)

    try:
        checks = _pycamp_split(tests) if tests.strip() else []
    except SyntaxError:
        checks = [tests]

    out = io.StringIO()
    steps = [0]

    def tracer(frame, event, arg):
        if event == 'line':
            steps[0] += 1
            if steps[0] > limit:
                raise TimeoutError('Превышен лимит шагов: похоже на бесконечный цикл (проверь условие while/for).')
        return tracer

    g = {'__name__': '__main__'}
    lines = stdin_data.split('\\n') if stdin_data else []
    pos = [0]

    def fake_input(prompt=''):
        if prompt:
            out.write(str(prompt))
        if pos[0] >= len(lines):
            raise RuntimeError('Кончился ввод (stdin) для input(). Добавь данные во ввод задачи.')
        v = lines[pos[0]]; pos[0] += 1
        return v

    g['input'] = fake_input

    result = {'status': 'ok', 'stdout': '', 'error': None, 'checks': [], 'timeout': False}
    old = sys.stdout
    sys.stdout = out
    sys.settrace(tracer)
    try:
        exec(compile(user, '<твой код>', 'exec'), g)
    except TimeoutError as e:
        sys.settrace(None); sys.stdout = old
        result['status'] = 'error'; result['timeout'] = True
        result['error'] = str(e); result['stdout'] = out.getvalue()
        return json.dumps(result)
    except BaseException:
        sys.settrace(None); sys.stdout = old
        result['status'] = 'error'
        result['error'] = traceback.format_exc()
        result['stdout'] = out.getvalue()
        return json.dumps(result)
    sys.settrace(None); sys.stdout = old

    for c in checks:
        item = {'src': c, 'ok': True, 'error': None, 'msg': None}
        old = sys.stdout; sys.stdout = out
        sys.settrace(tracer)
        try:
            exec(compile(c, '<проверка>', 'exec'), g)
        except TimeoutError as e:
            sys.settrace(None); sys.stdout = old
            item['ok'] = False; item['msg'] = str(e); item['error'] = 'TimeoutError'
            result['checks'].append(item); break
        except BaseException as e:
            sys.settrace(None); sys.stdout = old
            item['ok'] = False
            item['msg'] = str(e) or e.__class__.__name__
            item['error'] = traceback.format_exc()
        else:
            sys.settrace(None); sys.stdout = old
        result['checks'].append(item)
        if not item['ok']:
            break

    result['stdout'] = out.getvalue()
    if expected is not None:
        result['expected'] = expected
        result['stdout_ok'] = (result['stdout'].rstrip('\\n') == expected.rstrip('\\n'))
    return json.dumps(result)

_pycamp_run_js = _pycamp_run
`;

const b64 = s => {
  const bytes = new TextEncoder().encode(s == null ? '' : String(s));
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
};

async function runChecks(lesson, code) {
  await loadPython();
  const tests = (lesson.tests || '').trim();
  const expected = lesson.expected != null && lesson.expected !== '' ? String(lesson.expected) : '';
  const stdin = lesson.stdin != null ? String(lesson.stdin) : '';
  const raw = pyodide.globals.get('_pycamp_run_js')(
    b64(code), b64(tests), b64(stdin), expected ? b64(expected) : '', 1500000
  );
  const res = JSON.parse(raw);
  if (expected) res.stdout_ok = normOut(res.stdout) === normOut(expected);
  return res;
}

    const shown = (rec(l.id).hints || 0);
    rec(l.id).hints = Math.min(shown + 1, hs.length); save();
    renderHints(l);
  };
  if (rec(l.id).hints) { $('#hintCard').classList.remove('hidden'); renderHints(l); }
  $('#solBtn').onclick = () => { $('#solWrap').classList.toggle('hidden'); $('#solWrap').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); };
  $('#useSol').onclick = () => { ta.value = l.solution || ''; rec(l.id).code = ta.value; save(); syncGutter(); };
  if (prev) $('#prev').onclick = () => go(prev.id);
  if (next) $('#next').onclick = () => go(next.id);
  if ($('#finish')) $('#finish').onclick = () => { location.hash = 'done'; renderDone(); };
}

function renderHints(l) {
  const shown = rec(l.id).hints || 0;
  $('#hints').innerHTML = (l.hints || []).map((h, i) =>
    i < shown ? `<li>${h}</li>` : `<li style="color:var(--muted)">подсказка ${i + 1} — нажми «Подсказка» ещё раз</li>`).join('');
}
function plural(n, a, b, c) { const m = n % 100, d = n % 10; if (m > 10 && m < 20) return c; if (d === 1) return a; if (d >= 2 && d <= 4) return b; return c; }
function syncGutter() {
  const ta = $('#code'); if (!ta) return;
  const n = ta.value.split('\n').length;
  $('#gut').innerHTML = Array.from({ length: n }, (_, i) => i + 1).join('<br>');
}

/* ---------- запуск ---------- */
async function runAll(check) {
  const l = current; if (!l) return;
  const code = $('#code').value;
  rec(l.id).code = code; save();
  const out = $('#out'); $('#outIdle') && ($('#outIdle').style.display = 'none');
  const btn = $('#run'), btn2 = $('#runOnly');
  btn.disabled = btn2.disabled = true;
  out.innerHTML = `<div class="center"><span class="spin"></span> Выполняю ${check ? 'проверки' : 'код'}…</div>`;
  try {
    if (check && (!l.tests || !l.tests.trim()) && (l.expected == null || l.expected === '')) {
      const r = await runChecks(l, code);
      showResult(l, r, true);
      return;
    }
    const r = check ? await runChecks(l, code) : await runChecks({ ...l, tests: '', expected: '' }, code);
    showResult(l, r, check);
  } catch (e) {
    out.innerHTML = `<div class="banner no">⚠ Не удалось выполнить</div><div class="outbody">${esc(e && e.message || e)}</div>`;
  } finally { btn.disabled = btn2.disabled = false; }
}

function showResult(l, r, check) {
  const out = $('#out');
  const parts = [];
  let ok = false;
  let html = '';

  if (r.status === 'error') {
    html += `<div class="banner no">✗ Ошибка в коде</div>`;
    const err = r.timeout ? r.error : lastLine(r.error);
    html += `<div class="outbody" style="color:var(--bad)">${esc(err)}</div>`;
    if (r.error && !r.timeout) html += `<details><summary style="cursor:pointer;color:var(--muted);font-size:12.5px">полный traceback</summary><div class="outbody">${esc(r.error)}</div></details>`;
    html += stdoutBlock(r.stdout);
  } else {
    const checks = r.checks || [];
    const allOk = checks.every(c => c.ok);
    const expOk = r.expected === undefined ? true : !!r.stdout_ok;
    ok = allOk && expOk;
    html += ok
      ? `<div class="banner ok">✓ Всё верно! Урок засчитан.</div>`
      : `<div class="banner no">✗ Пока не проходит — посмотри детали ниже.</div>`;
    if (checks.length) {
      html += `<div style="margin-bottom:6px;color:var(--muted);font-size:12.5px">Проверок пройдено: ${checks.filter(c => c.ok).length} из ${checks.length}</div>`;
      html += checks.map(c => `<div class="check ${c.ok ? 'ok' : 'no'}">
        <span class="mk">${c.ok ? '✓' : '✗'}</span>
        <span class="msg">${c.ok ? 'проверка пройдена' : esc(c.msg || 'ошибка проверки')}
          <div class="dbg">${esc(prettyCheck(c.src))}</div>
          ${!c.ok && c.error && c.error !== 'TimeoutError' ? `<details><summary style="cursor:pointer;color:var(--muted);font-size:12px">детали</summary><span class="dbg">${esc(c.error)}</span></details>` : ''}
        </span></div>`).join('');
    }
    if (r.expected !== undefined) {
      html += `<div class="expected">${expOk ? '✓ вывод совпал с ожидаемым' : '✗ вывод не совпал с ожидаемым'}\nожидалось: ${esc(JSON.stringify(r.expected))}\nполучено:  ${esc(JSON.stringify(normOut(r.stdout)))}</div>`;
    }
    html += stdoutBlock(r.stdout);
  }
  out.innerHTML = html;

  if (check && ok) {
    if (!isDone(l)) { rec(l.id).done = true; save(); }
    renderToc(); renderGlobal(); highlightToc(l.id);
    const nx = LESSONS[l._n];
    const banner = document.createElement('div');
    banner.className = 'toolbar';
    banner.innerHTML = nx ? `<button class="btn primary" id="goNext">Дальше: ${esc(nx.title)} →</button>` : `<button class="btn primary" id="goFinish">🏁 Завершить курс</button>`;
    banner.style.marginTop = '10px';
    out.appendChild(banner);
    const gn = $('#goNext'); if (gn) gn.onclick = () => go(nx.id);
    const gf = $('#goFinish'); if (gf) gf.onclick = () => { location.hash = 'done'; renderDone(); };
    if (l._n === TOTAL && doneCount() === TOTAL) setTimeout(renderDone, 900);
  }
}
function stdoutBlock(s) {
  if (!s) return '';
  return `<div class="stdout"><b>Вывод программы:</b>\n${esc(normOut(s)) || '(пусто)'}</div>`;
}
function lastLine(tb) { const lines = String(tb).trim().split('\n'); return lines[lines.length - 1]; }
function prettyCheck(src) {
  const s = String(src).trim();
  return s.length > 160 ? s.slice(0, 157) + '…' : s;
}

/* ---------- финал ---------- */
function renderDone() {
  const done = doneCount() === TOTAL;
  const name = state.name || '';
  $('#main').innerHTML = `<div class="done-wrap">
    <h1 class="lt">${done ? '🏆 Курс пройден!' : '🏁 Финиш'}</h1>
    <div class="meta"><span>Пройдено уроков: ${doneCount()} из ${TOTAL}</span><span>${TOTAL - doneCount() ? `осталось ${TOTAL - doneCount()}` : 'все уроки закрыты'}</span></div>
    ${done ? `<div class="cert">
      <h2>Сертификат PyCamp</h2>
      <p>Выдан за прохождение полного курса Python: ${MODULES.length} модулей, ${TOTAL} уроков, ${TOTAL} практических проверок.</p>
      <p><input id="who" placeholder="Введи своё имя" value="${esc(name)}"> </p>
      <div id="certName" style="font-size:19px;font-weight:700;margin-top:6px">${esc(name || 'Имя не указано')}</div>
      <p style="color:var(--muted);font-size:13px;margin-top:10px">${new Date().toLocaleDateString('ru-RU')} · PyCamp, курс Python в браузере</p>
      <button class="btn" id="print">🖨 Распечатать / сохранить в PDF</button>
    </div>` : `<div class="banner info">Осталось пройти ${TOTAL - doneCount()} ${plural(TOTAL - doneCount(), 'урок', 'урока', 'уроков')}. Прогресс сохраняется в браузере автоматически.</div>`}
    <div class="toolbar" style="margin-top:16px">
      <button class="btn primary" id="first">← К первому уроку</button>
      <button class="btn" id="continueBtn">Продолжить обучение</button>
    </div>
    <div class="card" style="margin-top:18px"><h2>📊 По модулям</h2>
      ${MODULES.map(m => { const d = m.lessons.filter(isDone).length; const p = Math.round(d / m.lessons.length * 100);
        return `<div style="margin-bottom:10px"><div style="display:flex;gap:10px;font-size:13.5px"><span>${m.icon || ''} ${esc(m.title)}</span><span class="grow"></span><span style="color:var(--muted)">${d}/${m.lessons.length}</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`; }).join('')}
    </div></div>`;
  const who = $('#who');
  if (who) who.oninput = () => { state.name = who.value; save(); $('#certName').textContent = who.value || 'Имя не указано'; };
  if ($('#print')) $('#print').onclick = () => window.print();
  $('#first').onclick = () => go(LESSONS[0].id);
  const nx = LESSONS.find(l => !isDone(l)) || LESSONS[0];
  $('#continueBtn').onclick = () => go(nx.id);
  highlightToc(null);
}

/* ---------- init ---------- */
$('#burger').onclick = () => $('#side').classList.toggle('open');
$('#resetAll').onclick = () => {
  if (!confirm('Сбросить весь прогресс и код всех уроков?')) return;
  state = { lessons: {} }; save(); renderToc(); renderGlobal();
  current ? go(current.id) : go(LESSONS[0].id);
};
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if (h === 'done') return renderDone();
  if (byId[h] && (!current || current.id !== h)) go(h);
});

(function init() {
  renderToc(); renderGlobal();
  const h = location.hash.slice(1);
  if (h === 'done') return renderDone();
  go(byId[h] ? h : LESSONS[0].id);
  setPy('', 'Python загружается…');
  loadPython().catch(() => {});
})();
</script>
</body>
</html>
